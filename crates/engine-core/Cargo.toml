[package]
name = "engine-core"
version = "0.1.0"
edition = "2024"
publish = false
license-file = "../../LICENSE"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# `deterministic` is the default. The fast build is `--no-default-features --features fast`.
# Enabling both is a compile error (see lib.rs).
default = ["deterministic"]
deterministic = ["rapier3d/enhanced-determinism"]
fast = []

[dependencies]
rapier3d = "=0.36.1"
wasm-bindgen = "=0.2.130"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand_pcg = "0.10"
rand_core = "0.10"
